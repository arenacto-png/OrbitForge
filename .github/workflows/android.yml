name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify debug APK signature and SHA-256
        run: bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbitforge-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: error
